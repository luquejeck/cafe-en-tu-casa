<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel cocina: montaje con las escenas de Flow</title>
<!--
  Montaje del reel "Cómo inventar una cafetera automática" con las 21 escenas generadas en Google Flow
  (cocina/escenas/01.jpg … 21.jpg, una por golpe del guion). Cada escena entra en su frase con un golpe
  de cámara y zoom lento; subtítulos y contador encima. Tiempos: cocina/golpes.js (cocina/armar.py).
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>* { margin: 0; } html, body { width: 1080px; height: 1920px; overflow: hidden; background: #efe3d2; } .pre { position: absolute; left: -9999px; font-family: Inter; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="pre"><b style="font-weight:800">Aa</b><b style="font-weight:700">Aa</b></div>
<script src="golpes.js"></script>
<script>
(() => {
const FPS = 30, W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const back = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const escenas = GOLPES.map(g => { const im = new Image(); im.src = `escenas/${String(g.img).padStart(2, '0')}.jpg`; return im; });
function golpe(T) { let i = GOLPES.length - 1; while (i > 0 && T < GOLPES[i].t0) i--; return i; }
// hacia dónde va el zoom lento de cada imagen (fracción del cuadro, en el orden de escenas/01…21): casi siempre a la cara o al aparato nuevo
const FOCO = [[.5,.33],[.5,.3],[.45,.45],[.5,.35],[.45,.45],[.5,.28],[.6,.42],[.35,.5],[.5,.42],[.5,.38],[.5,.42],[.5,.38],[.5,.45],[.55,.45],[.45,.42],[.5,.45],[.5,.38],[.5,.42],[.5,.5],[.55,.48],[.5,.4]];
function escena(T, i, lt) {
  const im = escenas[i], g = GOLPES[i], [fx, fy] = FOCO[g.img - 1] || [.5, .4];
  const base = Math.max(W / im.width, H / im.height);             // cubrir el cuadro
  const golpeCam = 1 + .05 * (1 - easeOut(clamp(lt / .28)));        // golpe de cámara al entrar
  const lento = 1 + .06 * clamp(lt / Math.max(g.d, 1.2));            // zoom lento hacia el foco
  const z = base * golpeCam * lento, w = im.width * z, h = im.height * z;
  const k = clamp(lt / Math.max(g.d, 1.2)) * .5 + .5;
  const x = W / 2 - w * lerp(.5, fx, k), y = H / 2 - h * lerp(.5, fy, k) + 40;
  ctx.drawImage(im, clamp(x, W - w, 0), clamp(y, H - h, 0), w, h);
  // temblor en el caos de las siete
  if (g.id === 'siete') { ctx.save(); ctx.globalAlpha = .06; ctx.drawImage(im, clamp(x, W - w, 0) + Math.sin(T * 47) * 5, clamp(y, H - h, 0), w, h); ctx.restore(); }
  // destello del corte
  if (i > 0 && lt < .14) { ctx.fillStyle = `rgba(255,250,240,${.55 * (1 - lt / .14)})`; ctx.fillRect(0, 0, W, H); }
}
const easeOut = t => 1 - Math.pow(1 - t, 3);
/* ---------------------------------------------------------------- textos (en pantalla, sin cámara) */
let tramos = [];
function armarTramos() {
  let g = []; tramos = [];
  PALABRAS.forEach(w => { const clave = /^(pero|entonces,?)$/i.test(w.text) || /^¿/.test(w.text);
    if (g.length && (clave || g.length >= 4)) { tramos.push(g); g = []; } g.push(w); if (/[.?!:…]$/.test(w.text)) { tramos.push(g); g = []; } });
  if (g.length) tramos.push(g);
}
function textos(T, i, lt) {
  const g = GOLPES[i];
  // velo claro arriba para que se lean
  const gr = ctx.createLinearGradient(0, 0, 0, 640); gr.addColorStop(0, 'rgba(250,244,234,.92)'); gr.addColorStop(.6, 'rgba(250,244,234,.62)'); gr.addColorStop(1, 'rgba(250,244,234,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 760);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#1d1d1f'; ctx.font = '700 30px Inter'; ctx.fillText('●  Café en tu Casa', W / 2, 150);
  ctx.fillStyle = '#6e6e73'; ctx.font = '800 31px Inter'; ctx.fillText('CÓMO INVENTAR UNA CAFETERA AUTOMÁTICA', W / 2, 230);
  // barra de 9 problemas
  const n = SOLUCIONES, bw = 780, gap = 10, sw = (bw - gap * (n - 1)) / n;
  for (let k = 0; k < n; k++) { const on = k < g.contador, nuevo = k === g.contador - 1 && g.tipo === 'solucion' ? back(clamp(lt / .35)) : 1;
    ctx.fillStyle = on ? '#5b6e32' : 'rgba(0,0,0,.1)'; const x = W / 2 - bw / 2 + k * (sw + gap);
    ctx.beginPath(); ctx.roundRect(x, 262 - (on ? (nuevo - 1) * 6 : 0), sw, 13 * (on ? nuevo : 1), 7); ctx.fill(); }
  const cont = g.tipo === 'gancho' ? `${n} problemas para hacer un café` : g.tipo === 'problema' ? `Problema ${g.contador + 1} de ${n}` : `✓ ${g.contador} de ${n} resueltos`;
  ctx.fillStyle = g.tipo === 'problema' ? '#c8372d' : '#5b6e32'; ctx.font = '800 32px Inter'; ctx.fillText(cont, W / 2, 325);
  // subtítulo palabra por palabra
  let k = tramos.findIndex((tr, j) => T < (tramos[j + 1] ? tramos[j + 1][0].start - .02 : 1e9));
  const tr = tramos[Math.max(0, k)] || [];
  if (!tr.length || T < tr[0].start - .12 || T > tr[tr.length - 1].end + .6) return;
  const k0 = clamp((T - tr[0].start + .12) / .12), tam = 84;
  ctx.font = `800 ${tam}px Inter`;
  const ws = tr.map(w => w.text.replace(/,$/, '')), anchos = ws.map(w => ctx.measureText(w + ' ').width);
  // dos líneas si no entra
  const lineas = [[]]; let ac = 0; ws.forEach((w, j) => { if (ac + anchos[j] > 960 && lineas[lineas.length - 1].length) { lineas.push([]); ac = 0; } lineas[lineas.length - 1].push(j); ac += anchos[j]; });
  ctx.save(); ctx.translate(W / 2, 425); ctx.scale(.94 + .06 * k0, .94 + .06 * k0); ctx.globalAlpha = k0;
  lineas.forEach((ln, li) => {
    const total = ln.reduce((a, j) => a + anchos[j], 0); let x = -total / 2; const y = (li - (lineas.length - 1) / 2) * tam * 1.04 + tam * .35;
    ln.forEach(j => { const w = tr[j], t = w.text.toLowerCase().replace(/[^\wáéíóúñ]/g, '');
      ctx.fillStyle = t === 'pero' ? '#c8372d' : t === 'entonces' ? '#5b6e32' : T >= w.start - .05 ? '#1d1d1f' : 'rgba(29,29,31,.28)';
      ctx.textAlign = 'left'; ctx.strokeStyle = 'rgba(250,244,234,.9)'; ctx.lineWidth = 10; ctx.lineJoin = 'round';
      ctx.strokeText(ws[j], x, y); ctx.fillText(ws[j], x, y); x += anchos[j]; });
  });
  ctx.restore();
  // marca al final
  if (g.id === 'caja' || g.id === 'final') { const km = g.id === 'caja' ? ease(clamp((lt - 1.2) / .4)) : 1;
    ctx.globalAlpha = km; ctx.font = '700 44px Inter'; ctx.textAlign = 'center'; const tx = "De'Longhi Magnifica S", tw = ctx.measureText(tx).width + 92;
    ctx.fillStyle = '#1d1d1f'; ctx.beginPath(); ctx.roundRect(W / 2 - tw / 2, 1430 + (1 - km) * 30, tw, 92, 46); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(tx, W / 2, 1491 + (1 - km) * 30); ctx.globalAlpha = 1; }
}


function cuadro(f) {
  const T = f / FPS, i = golpe(T), lt = T - GOLPES[i].t0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#efe3d2'; ctx.fillRect(0, 0, W, H);
  escena(T, i, lt);
  const v = ctx.createRadialGradient(W / 2, 1100, 500, W / 2, 1100, 1300); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(60,35,15,.3)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  textos(T, i, lt);
}
window.prepararModelo = async () => {
  await document.fonts.ready; await Promise.all(escenas.map(im => im.complete ? 0 : new Promise(r => im.onload = r)));
  armarTramos(); cuadro(0); return Math.round(DURACION * FPS);
};
window.cuadro = cuadro;
})();
</script>
</body>
</html>
