<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Modelo animado</title>
<!--
  Dibuja y anima una cafetera a partir de su modelo en JSON (instagram/modelos/*.json).
  Cada cuadro es determinístico: window.cuadro(f) deja la escena en el cuadro f (30 por segundo),
  así se puede filmar con node instagram/filmar-modelo.mjs.
  Para mirarlo en el navegador hace falta un servidor (fetch no lee archivos locales):
    npx serve .   →   http://localhost:3000/instagram/modelo.html?modelo=magnifica-s&play
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7; --ink: #1d1d1f; --ink-2: #6e6e73; --oliva: #5b6e32; --oliva-claro: #a3c26a;
    --oliva-suave: rgba(91, 110, 50, .12);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #escena { position: relative; width: 1080px; height: 1920px; }
  .marca { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .marca i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: var(--oliva); margin-right: 12px; vertical-align: 3px; }
  .texto { position: absolute; top: 300px; left: 80px; right: 80px; text-align: center; }
  .texto .ep { font-size: 27px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--oliva); }
  .texto h1 { font-size: 74px; font-weight: 600; line-height: 1.05; letter-spacing: -.035em; margin-top: 18px; text-wrap: balance; }
  .texto p { font-size: 34px; color: var(--ink-2); line-height: 1.35; margin-top: 20px; text-wrap: balance; }
  .texto .boton { display: inline-block; margin-top: 30px; background: var(--ink); color: #fff; font-size: 32px; font-weight: 600; padding: 20px 44px; border-radius: 980px; }
  #maquina { position: absolute; left: 40px; top: 660px; width: 1000px; height: 1120px;
    /* bordes suaves: cuando la cámara se acerca, la máquina no queda cortada en seco */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 70px, #000 calc(100% - 90px), transparent 100%),
                        linear-gradient(to right, transparent 0, #000 60px, #000 calc(100% - 60px), transparent 100%);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .puntos { position: absolute; bottom: 92px; left: 0; right: 0; display: flex; justify-content: center; gap: 14px; }
  .puntos span { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,.14); }
  .puntos span.on { background: var(--oliva); width: 40px; border-radius: 8px; }
  .etq rect { fill: #fff; }
  .etq text { font-weight: 600; fill: var(--ink); }
</style>
</head>
<body>
<div id="escena">
  <div class="marca"><i></i>Café en tu Casa</div>
  <div class="texto" id="texto"></div>
  <svg id="maquina" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="puntos" id="puntos"></div>
</div>
<script>
(() => {
  const FPS = 30;
  const NS = 'http://www.w3.org/2000/svg';
  const q = new URLSearchParams(location.search);
  let M, C, inicio = [], total = 0, largoCaminos = {};

  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  const col = c => (M.colores[c] || c);
  const el = (tag, attrs = {}, padre) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v != null) n.setAttribute(k, v);
    if (padre) padre.appendChild(n);
    return n;
  };
  const mezclar = (h1, h2, k) => {
    const a = h1.match(/\w\w/g).map(x => parseInt(x, 16)), b = h2.match(/\w\w/g).map(x => parseInt(x, 16));
    return '#' + a.map((v, i) => Math.round(lerp(v, b[i], k)).toString(16).padStart(2, '0')).join('');
  };

  /* ---------------------------------------------------------- caminos */
  function largo(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
  function punto(nombre, f) {
    const pts = M.caminos[nombre]; let d = clamp(f) * largoCaminos[nombre];
    for (let i = 1; i < pts.length; i++) {
      const s = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (d <= s || i === pts.length - 1) { const k = s ? clamp(d / s) : 0; return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)]; }
      d -= s;
    }
  }

  /* ---------------------------------------------------------- dibujo base */
  const nodos = {};   // id de pieza -> { g, formas[], nivel (rect), espuma }
  let capaParticulas, capaFlujos, capaEtiquetas, mundo;

  function engranaje({ cx, cy, r, dientes }) {
    let d = '';
    for (let i = 0; i < dientes * 2; i++) {
      const a = (i / (dientes * 2)) * Math.PI * 2, rr = i % 2 ? r * .78 : r;
      const a2 = a + Math.PI / dientes;
      d += `${i ? 'L' : 'M'}${cx + rr * Math.cos(a)} ${cy + rr * Math.sin(a)} L${cx + rr * Math.cos(a2)} ${cy + rr * Math.sin(a2)} `;
    }
    return d + 'Z';
  }

  function forma(f, padre) {
    const comun = { stroke: col('borde'), 'stroke-width': 2 };
    if (f.tipo === 'rect') return el('rect', { x: f.x, y: f.y, width: f.w, height: f.h, rx: f.rx || 0, fill: col(f.relleno || 'pieza'), ...comun }, padre);
    if (f.tipo === 'circle') return el('circle', { cx: f.cx, cy: f.cy, r: f.r, fill: col(f.relleno || 'pieza'), ...comun }, padre);
    if (f.tipo === 'path') return el('path', { d: f.d, fill: col(f.relleno || 'pieza'), ...comun }, padre);
    if (f.tipo === 'engranaje') return el('path', { d: engranaje(f), fill: col(f.relleno || 'pieza'), ...comun }, padre);
    if (f.tipo === 'linea') return el('path', { d: f.d, fill: 'none', stroke: col(f.color || 'borde'), 'stroke-width': f.ancho || 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, padre);
  }

  function construir() {
    const svg = document.getElementById('maquina');
    svg.innerHTML = '';
    const defs = el('defs', {}, svg);
    // Patrones: granos de café y café molido
    const pg = el('pattern', { id: 'p-granos', width: 18, height: 13, patternUnits: 'userSpaceOnUse' }, defs);
    el('rect', { width: 18, height: 13, fill: col('grano') }, pg);
    [[5, 4, 20], [13, 10, -25]].forEach(([x, y, a]) => {
      el('ellipse', { cx: x, cy: y, rx: 5, ry: 3.4, fill: '#8f6340', transform: `rotate(${a} ${x} ${y})` }, pg);
      el('path', { d: `M${x - 3} ${y} Q${x} ${y - 1.5} ${x + 3} ${y}`, stroke: '#4a2f1a', 'stroke-width': 1, fill: 'none', transform: `rotate(${a} ${x} ${y})` }, pg);
    });
    const pp = el('pattern', { id: 'p-polvo', width: 6, height: 6, patternUnits: 'userSpaceOnUse' }, defs);
    el('rect', { width: 6, height: 6, fill: col('molido') }, pp);
    el('circle', { cx: 1.5, cy: 2, r: .9, fill: '#7a5232' }, pp);
    el('circle', { cx: 4.5, cy: 4.5, r: .7, fill: '#3e2716' }, pp);
    const glow = el('filter', { id: 'brillo', x: '-40%', y: '-40%', width: '180%', height: '180%' }, defs);
    el('feDropShadow', { dx: 0, dy: 0, stdDeviation: 6, 'flood-color': col('foco'), 'flood-opacity': .9 }, glow);

    mundo = el('g', {}, svg);
    for (const p of M.piezas) {
      const g = el('g', { 'data-id': p.id }, mundo);
      const formas = p.formas.map(f => forma(f, g));
      const n = { g, formas, pieza: p };
      if (p.contenido) {
        const c = p.contenido, cid = 'clip-' + p.id;
        const clip = el('clipPath', { id: cid }, defs);
        if (c.d) el('path', { d: c.d }, clip); else el('rect', { x: c.x, y: c.y, width: c.w, height: c.h, rx: c.rx || 0 }, clip);
        const gc = el('g', { 'clip-path': `url(#${cid})` }, g);
        const caja = c.d ? { x: 0, y: c.y, w: 600, h: c.h } : { x: c.x, y: c.y, w: c.w, h: c.h };
        n.caja = caja;
        n.nivel = el('rect', { x: caja.x, width: caja.w, fill: c.patron ? `url(#p-${c.patron})` : col(c.color), opacity: c.color === 'agua' ? .85 : 1 }, gc);
        if (c.espuma) n.espuma = el('rect', { x: caja.x, width: caja.w, height: 5, fill: col(c.espuma) }, gc);
        // la forma de vidrio vuelve a dibujarse arriba, para que el borde quede sobre el contenido
        if (p.formas[0].relleno === 'vidrio') { const borde = forma({ ...p.formas[0], relleno: 'none' }, g); borde.setAttribute('fill', 'none'); formas.push(borde); }
      }
      nodos[p.id] = n;
    }
    capaFlujos = el('g', {}, mundo);
    capaParticulas = el('g', {}, mundo);
    capaEtiquetas = el('g', { class: 'etq' }, mundo);

    const nums = M.pasos.filter(s => s.numero).length;
    document.getElementById('puntos').innerHTML = Array.from({ length: nums }, () => '<span></span>').join('');
  }

  /* ---------------------------------------------------------- estado en el tiempo T */
  function estado(T) {
    const st = { nivel: {}, ang: {}, dy: {}, paso: 0, lt: 0 };
    for (const p of M.piezas) { if (p.contenido) st.nivel[p.id] = p.contenido.nivel || 0; st.ang[p.id] = 0; st.dy[p.id] = 0; }
    M.pasos.forEach((s, i) => {
      const lt = T - inicio[i];
      if (lt < 0) return;
      st.paso = i; st.lt = lt;
      const t = Math.min(lt, s.d);
      for (const a of s.acciones) {
        const k = ease(clamp((t - (a.t0 || 0)) / (a.dur || .001)));
        if (a.tipo === 'llenar') st.nivel[a.parte] = lerp(st.nivel[a.parte], a.a, k);
        if (a.tipo === 'girar') st.ang[a.parte] += a.grados * k;
        if (a.tipo === 'mover') st.dy[a.parte] = lerp(st.dy[a.parte], a.dy, k);
      }
    });
    return st;
  }

  /* ---------------------------------------------------------- un cuadro */
  function cuadro(f) {
    const T = f / FPS, st = estado(T), i = st.paso, s = M.pasos[i], lt = st.lt;
    const prev = M.pasos[Math.max(0, i - 1)];
    const kt = ease(clamp(lt / .7));

    // cámara
    const cam = { x: lerp(prev.camara.x, s.camara.x, kt), y: lerp(prev.camara.y, s.camara.y, kt), z: lerp(prev.camara.zoom, s.camara.zoom, kt) };
    const W0 = M.lienzo.alto * (1000 / 1120), vw = W0 / cam.z, vh = M.lienzo.alto / cam.z;
    document.getElementById('maquina').setAttribute('viewBox', `${cam.x - vw / 2} ${cam.y - vh / 2} ${vw} ${vh}`);

    // aparición en la portada
    const ap = s.acciones.find(a => a.tipo === 'aparecer');
    const kap = ap ? ease(clamp((lt - ap.t0) / ap.dur)) : 1;
    mundo.setAttribute('opacity', (i === 0 ? kap : 1) * (s.cierre ? lerp(1, .3, kt) : 1));
    mundo.setAttribute('transform', i === 0 ? `translate(300 360) scale(${lerp(.92, 1, kap)}) translate(-300 -360)` : '');

    // foco: mezcla entre el del paso anterior y el actual
    const enFoco = (paso, id) => !paso.foco.length || paso.foco.includes(id);
    for (const p of M.piezas) {
      const n = nodos[p.id];
      const o = (paso) => p.fijo ? 1 : enFoco(paso, p.id) ? 1 : .26;
      const resaltado = (paso) => paso.foco.length && paso.foco.includes(p.id) ? 1 : 0;
      n.g.setAttribute('opacity', lerp(o(prev), o(s), kt).toFixed(3));
      const r = lerp(resaltado(prev), resaltado(s), kt);
      n.formas.forEach(fm => {
        const orig = fm.dataset.s ??= fm.getAttribute('stroke');
        fm.setAttribute('stroke', r > .5 && orig === col('borde') ? col('foco') : orig);
      });
      n.g.setAttribute('filter', r > .5 ? 'url(#brillo)' : '');
      // transformaciones
      const tr = [];
      if (st.dy[p.id]) tr.push(`translate(0 ${st.dy[p.id]})`);
      if (st.ang[p.id] && p.centro) tr.push(`rotate(${st.ang[p.id]} ${p.centro[0]} ${p.centro[1]})`);
      n.g.setAttribute('transform', tr.join(' '));
      // niveles
      if (n.nivel) {
        const h = n.caja.h * clamp(st.nivel[p.id]), y = n.caja.y + n.caja.h - h;
        n.nivel.setAttribute('y', y); n.nivel.setAttribute('height', h);
        if (n.espuma) { n.espuma.setAttribute('y', y); n.espuma.setAttribute('opacity', h > 3 ? 1 : 0); }
      }
    }
    // calor y pulso (solo durante el paso)
    nodos.thermoblock.formas[0].setAttribute('fill', col('pieza'));
    for (const a of s.acciones) {
      const k = clamp((lt - a.t0) / a.dur);
      if (a.tipo === 'calor') {
        const v = Math.sin(Math.PI * k) * (k > 0 && k < 1 ? 1 : 0);
        nodos[a.parte].formas[0].setAttribute('fill', mezclar(col('pieza'), col('calor'), clamp(v * 1.4)));
      }
      if (a.tipo === 'pulso') {
        const v = Math.sin(Math.PI * clamp((lt - a.t0) / .5));
        nodos[a.parte].formas.forEach((fm, j) => j && fm.setAttribute('fill', v > .05 ? mezclar(col('borde'), col('foco'), v) : col('borde')));
      }
    }

    // flujos
    capaFlujos.innerHTML = '';
    for (const a of s.acciones.filter(a => a.tipo === 'flujo')) {
      const k = (lt - a.t0) / a.dur;
      if (k <= 0 || k >= 1) continue;
      const op = Math.min(1, k * 5, (1 - k) * 5);
      const d = 'M' + M.caminos[a.camino].map(p => p.join(' ')).join(' L');
      el('path', { d, fill: 'none', stroke: col(a.color), 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .35 * op }, capaFlujos);
      el('path', { d, fill: 'none', stroke: col(a.color), 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-dasharray': '10 16', 'stroke-dashoffset': -lt * 70, opacity: op }, capaFlujos);
    }

    // partículas
    capaParticulas.innerHTML = '';
    for (const a of s.acciones.filter(a => a.tipo === 'particulas')) {
      const ventana = Math.max(0, a.dur - a.viaje);
      for (let j = 0; j < a.n; j++) {
        const inicioP = a.t0 + (a.n > 1 ? j * ventana / (a.n - 1) : 0);
        const p = (lt - inicioP) / a.viaje;
        if (p <= 0 || p >= 1) continue;
        let [x, y] = punto(a.camino, a.forma === 'pastilla' ? ease(p) : p);
        const jit = ((j * 37) % 9) - 4;
        const op = Math.min(1, p * 6, (1 - p) * 6);
        if (a.forma === 'grano') { x += jit * 2.4; el('ellipse', { cx: x, cy: y, rx: 6, ry: 4.2, fill: '#8f6340', stroke: '#4a2f1a', 'stroke-width': 1, opacity: op, transform: `rotate(${j * 47 + p * 200} ${x} ${y})` }, capaParticulas); }
        if (a.forma === 'gota') { x += jit * .6; el('ellipse', { cx: x, cy: y, rx: 3.2, ry: 4.6, fill: col(a.color), opacity: op }, capaParticulas); }
        if (a.forma === 'polvo') { x += jit * 1.6; el('circle', { cx: x, cy: y, r: 2.2, fill: col(a.color), opacity: op }, capaParticulas); }
        if (a.forma === 'vapor') { x += jit * 3 * p; el('circle', { cx: x, cy: y, r: 4 + p * 6, fill: '#ffffff', opacity: .7 * (1 - p) }, capaParticulas); }
        if (a.forma === 'pastilla') el('rect', { x: x - 20, y: y - 8, width: 40, height: 16, rx: 6, fill: 'url(#p-polvo)', stroke: '#3e2716', 'stroke-width': 1.5, transform: `rotate(${p * 70} ${x} ${y})` }, capaParticulas);
      }
    }

    // etiquetas de las piezas en foco (tamaño constante en pantalla)
    capaEtiquetas.innerHTML = '';
    const ke = clamp((lt - .45) / .35) * (s.d - lt > .2 ? 1 : clamp((s.d - lt) / .2));
    if (ke > 0 && !s.cierre) for (const id of s.foco) {
      const p = M.piezas.find(x => x.id === id);
      if (!p.etiqueta) continue;
      const fs = 19 / cam.z, padX = 12 / cam.z, padY = 8 / cam.z;
      const g = el('g', { opacity: ke }, capaEtiquetas);
      const t = el('text', { x: p.etiqueta.x, y: p.etiqueta.y, 'font-size': fs, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, g);
      t.textContent = p.nombre;
      const bb = t.getBBox();
      const r = el('rect', { x: bb.x - padX, y: bb.y - padY, width: bb.width + padX * 2, height: bb.height + padY * 2, rx: (bb.height + padY * 2) / 2, stroke: col('foco'), 'stroke-width': 2 / cam.z }, g);
      g.insertBefore(r, t);
    }

    // texto
    const tx = document.getElementById('texto');
    if (tx.dataset.paso !== String(i)) {
      tx.dataset.paso = i;
      tx.innerHTML = `<p class="ep">${s.epigrafe || ''}</p><h1>${s.titulo}</h1>${s.bajada ? `<p>${s.bajada}</p>` : ''}${s.boton ? `<span class="boton">${s.boton}</span>` : ''}`;
    }
    const salida = i < M.pasos.length - 1 ? clamp((s.d - lt) / .25) : 1;
    [...tx.children].forEach((c, j) => {
      const k = ease(clamp((lt - j * .1) / .4)) * salida;
      c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 24}px)`;
    });
    document.querySelectorAll('#puntos span').forEach((d, j) => d.classList.toggle('on', s.numero === j + 1));
    document.getElementById('puntos').style.opacity = s.numero ? 1 : 0;
  }

  /* ---------------------------------------------------------- arranque */
  window.prepararModelo = async (nombre) => {
    M = await (await fetch(`modelos/${nombre}.json`)).json();
    inicio = []; total = 0;
    for (const s of M.pasos) { inicio.push(total); total += s.d; }
    for (const [k, pts] of Object.entries(M.caminos)) largoCaminos[k] = largo(pts);
    await document.fonts.ready;
    construir();
    cuadro(0);
    return Math.round(total * FPS);
  };
  window.cuadro = cuadro;
  window.FPS = FPS;

  if (q.get('modelo')) prepararModelo(q.get('modelo')).then(n => {
    if (q.has('f')) return cuadro(+q.get('f'));
    if (q.has('play')) { const t0 = performance.now(); const loop = () => { cuadro(Math.floor((performance.now() - t0) / 1000 * FPS) % n); requestAnimationFrame(loop); }; loop(); }
  });
})();
</script>
</body>
</html>
