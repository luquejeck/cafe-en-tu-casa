<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Instagram · Plan del mes — Café en tu Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #1d1d1f; --ink-2: #6e6e73; --bg-2: #f5f5f7; --brand: #5b6e32; --linea: rgba(0,0,0,.1); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--bg-2); padding: 40px 20px 80px; -webkit-font-smoothing: antialiased; }
.ancho { max-width: 1120px; margin: 0 auto; }
h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 600; letter-spacing: -.03em; }
.plomo { color: var(--ink-2); font-size: 1.1rem; margin-top: 10px; max-width: 60ch; }
h2 { font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; margin: 56px 0 18px; }
.pieza { background: #fff; border-radius: 22px; padding: 24px; margin-bottom: 16px; }
.cab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 16px; }
.cab b { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.cab h3 { font-size: 1.2rem; font-weight: 600; letter-spacing: -.02em; }
.cab span { color: var(--ink-2); font-size: .9rem; }
.tira { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.tira img { height: 320px; width: auto; border-radius: 12px; border: 1px solid var(--linea); flex-shrink: 0; }
details { margin-top: 14px; }
summary { cursor: pointer; font-weight: 600; font-size: .95rem; }
pre { margin-top: 10px; white-space: pre-wrap; font: inherit; font-size: .95rem; line-height: 1.5; color: var(--ink-2); background: var(--bg-2); border-radius: 12px; padding: 16px; }
</style>
</head>
<body>
<div class="ancho">
  <h1>Instagram · Plan del mes</h1>
  <p class="plomo" id="resumen"></p>
  <div id="plan"></div>
</div>
<script src="../assets/js/productos.js"></script>
<script src="contenido.js"></script>
<script>
  const TEMA = { 1: 'Presentación', 2: 'Magnifica S', 3: 'Krups Roma y guía de compra', 4: 'Dedica y confianza' };
  const NOMBRE = { carrusel: 'Carrusel', post: 'Post', historia: 'Historia', reel: 'Reel' };
  const cuenta = t => PIEZAS.filter(p => p.tipo === t).length;

  document.getElementById('resumen').textContent =
    `${PIEZAS.length} publicaciones en 4 semanas: ${cuenta('carrusel')} carruseles, ${cuenta('post')} post, ` +
    `${cuenta('historia')} historias y ${cuenta('reel')} reels. Nada está publicado ni programado.`;

  document.getElementById('plan').innerHTML = [1, 2, 3, 4].map(sem =>
    `<h2>Semana ${sem} · ${TEMA[sem]}</h2>` +
    PIEZAS.filter(p => p.semana === sem).map(p => `
      <article class="pieza">
        <div class="cab"><b>${p.dia} · ${NOMBRE[p.tipo]}</b><h3>${p.titulo}</h3>
          <span>${p.placas.length} ${p.tipo === 'reel' ? 'cuadros' : p.placas.length > 1 ? 'placas' : 'placa'}</span></div>
        <div class="tira">${p.placas.map((_, n) => `<img loading="lazy" src="../assets/img/ig/${p.id}-${n + 1}.jpg" alt="">`).join('')}</div>
        ${p.caption ? `<details><summary>Texto de la publicación</summary><pre>${p.caption}</pre></details>` : ''}
      </article>`).join('')
  ).join('');
</script>
</body>
</html>
