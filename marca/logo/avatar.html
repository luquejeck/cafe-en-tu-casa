<!doctype html><meta charset="utf-8">
<style>
/* Avatar de perfil: círculo negro, "C" blanca y punto oliva. Se renderiza a
   1080 px; Instagram lo recorta en círculo. ?v=lado|abajo  ?aro=1 */
body{margin:0;width:1080px;height:1080px;display:grid;place-items:center;background:#fff;font-family:Inter,-apple-system,Helvetica,Arial,sans-serif}
.a{width:1080px;height:1080px;border-radius:50%;background:#101012;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:400px;letter-spacing:-.04em;box-sizing:border-box}
.a span{color:#a3c26a}
.aro .a{width:1000px;height:1000px;box-shadow:0 0 0 20px #fff,0 0 0 40px #5b6e32;font-size:370px}
.abajo .a{flex-direction:column;line-height:.9}
.abajo .a span{font-size:.5em;line-height:.4}
</style>
<div id="r"><div class="a">C<span>·</span></div></div>
<script>const q=new URLSearchParams(location.search);document.body.className=(q.get("v")||"lado")+(q.get("aro")?" aro":"")</script>
